<!DOCTYPE html>
<html class="theme-auto" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Far East Scala</title>
    <link rel="icon" type="image/x-icon" href="FarEastScala_files/FES%20FES.png">
    <meta name="description" content="illegal C-POP">
    <meta name="author" content="DJ小男孩 DJ小女孩">
    <!-- GSAP -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
        }
        
        body {
            min-height: 100vh;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            background-color: #9d2d2a;
            background-image: url("FarEastScala_files/jzdzrrr.jpg");
            background-repeat: repeat;
            background-size: auto;
            background-position: center center;
            background-attachment: fixed;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            overflow: auto;
            position: relative;
        }
        
        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 200%;
            height: 200%;
            z-index: 1;
            pointer-events: none;
            animation: flicker 0.4s infinite;
        }
        
        @keyframes flicker {
            0%, 100% { background: rgba(0, 0, 0, 0.3); }
            50% { background: rgba(255, 255, 255, 0.1); }
        }
        
        .main-section {
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            z-index: 2;
        }
        
        /* 头像容器 - 简化版本 */
        .avatar-container {
            position: relative;
            width: 80vw;
            max-width: 420px;
            height: 40vh;
            max-height: 400px;
        }

        /* 基础头像样式 */
        .avatar {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;


        }

        /* 第一张图片 - 显示3秒 */
        .avatar-1 {
            animation: showHide1 0.3s infinite;
            filter: blur(0px) grayscale(0.4) contrast(1.5) drop-shadow(0 0 30px #fffb00ff);
        }

        /* 第二张图片 - 显示3秒 */
        .avatar-2 {
            animation: showHide2 0.3s infinite;
            filter: blur(0px) grayscale(0.4) contrast(1.5) drop-shadow(0 0 30px #942192ff);
        }

        /* 简单的显示/隐藏动画 */
        @keyframes showHide1 {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }

        @keyframes showHide2 {
            0%, 50% { opacity: 0; }
            51%, 100% { opacity: 1; }
        }
        
        .button-stack {
            position: absolute;
            bottom: 5vh;
            left: 50%;
            transform: translateX(-50%);
            z-index: 3;
            display: flex;
            flex-direction: row;
            gap: 4vw;
            align-items: center;
            background: none;
            padding: 0;
        }
        
        .button {
            background: none;
            border-radius: 0;
            width: auto;
            height: auto;
            min-width: unset;
            min-height: unset;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s;
            box-shadow: red;
            border: none;
            outline: none;
            padding: 0;
			animation: buttonFlicker 0.s infinite;
        }
		
		@keyframes buttonFlicker {
		    0%, 100% { 
		        opacity: 1;
		        filter: drop-shadow(0 0 8px #ff0000cc);
		    }
		    25% { 
		        opacity: 0.8;
		        filter: drop-shadow(0 0 12px #ff0000cc);
		    }
		    50% { 
		        opacity: 0.6;
		        filter: drop-shadow(0 0 15px #ff0000cc);
		    }
		    75% { 
		        opacity: 0.9;
		        filter: drop-shadow(0 0 10px #ff0000cc);
		    }
		}
        
        .button:hover {
            transform: scale(1.12);
                /* 悬停时停止闪烁，保持高亮 */
                animation: none;
                filter: drop-shadow(0 0 20px #ff0000) brightness(4);
        }
        
		
		
		.icon {
			width: clamp(20px, 6vw, 32px);
			height: clamp(20px, 6vw, 32px);
			/* 稳定的红色 */
			filter: invert(100) sepia(0) saturate(0) hue-rotate(0deg);
			transition: all 0.1s ease;
		}

		/* SoundCloud - 橙色阴影 */
		.button:nth-child(1) .icon {
			filter: invert(100) sepia(0) saturate(0) hue-rotate(0deg) drop-shadow(0 0 12px #ff5500);
		}

		/* Instagram - 粉色阴影 */
		.button:nth-child(2) .icon {
			filter: invert(100) sepia(0) saturate(0) hue-rotate(0deg) drop-shadow(0 0 12px #e1306c);
		}

		/* Discord - 蓝色阴影 */
		.button:nth-child(3) .icon {
			filter: invert(100) sepia(0) saturate(0) hue-rotate(0deg) drop-shadow(0 0 12px #fffb00);
		}

		/* Email - 绿色阴影 */
		.button:nth-child(4) .icon {
			filter: invert(100) sepia(0) saturate(0) hue-rotate(0deg) drop-shadow(0 0 12px #0433ff);
		}

		/* 悬停时增强阴影效果 */
		.button:hover:nth-child(1) .icon {
			filter: invert(100) sepia(0) saturate(0) hue-rotate(0deg) drop-shadow(0 0 20px #ff5500);
			transform: scale(1.1);
		}

		.button:hover:nth-child(2) .icon {
			filter: invert(100) sepia(0) saturate(0) hue-rotate(0deg) drop-shadow(0 0 20px #e1306c);
			transform: scale(1.1);
		}

		.button:hover:nth-child(3) .icon {
			filter: invert(100) sepia(0) saturate(0) hue-rotate(0deg) drop-shadow(0 0 20px #5865f2);
			transform: scale(1.1);
		}

		.button:hover:nth-child(4) .icon {
			filter: invert(100) sepia(0) saturate(0) hue-rotate(0deg) drop-shadow(0 0 20px #00ff00);
			transform: scale(1.1);
		}
        
        footer {
            position: absolute;
            bottom: 2vh;
            font-size: clamp(0.8em, 3vw, 0.9em);
            color: rgba(0, 0, 0, 1.0);
            z-index: 2;
        }

        @media (max-width: 600px) {
            .button-stack {
                gap: 6vw;
            }
            .avatar-container {
                width: 90vw;
                height: 30vh;
            }
        }
		
		 @media (max-aspect-ratio: 16/9) {
		            body {
		                background-size: auto 100%;
		            }
		        }
		        
		        @media (min-aspect-ratio: 16/9) {
		            body {
		                background-size: 100% auto;
		            }
		        }
		        
		        @media (max-width: 767px) {
		            .button-stack {
		                gap: 8vw;
		                width: 90%;
		                justify-content: space-around;
		            }
		            .button {
		                flex: 1;
		                max-width: 60px;
		            }
		        }
				
				
    </style>
</head>

<audio id="bgMusic" autoplay loop>
    <source src="FarEastScala_files/motherrr.mp3" type="audio/mpeg">
</audio>

<body>
    <div class="main-section">
        <div class="avatar-container">
            <img class="avatar avatar-1" src="FarEastScala_files/Majestic%20Social.png" alt="Majestic Social">
            <img class="avatar avatar-2" src="FarEastScala_files/节奏的主人%20LOGO.png" alt="节奏的主人">
        </div>
        <div class="button-stack">
            <a class="button button-soundcloud" href="https://soundcloud.com/dongbeisluts" target="_blank">
                <img class="icon" src="FarEastScala_files/soundcloud.svg" alt="SoundCloud">
            </a>
            <a class="button button-instagram" href="https://www.instagram.com/fareastscala" target="_blank">
                <img class="icon" src="FarEastScala_files/instagram.svg" alt="Instagram">
            </a>
            <a class="button button-discord" href="https://discord.gg/ev6xbtQ3XZ" target="_blank">
                <img class="icon" src="FarEastScala_files/discord.svg" alt="Discord">
            </a>
            <a class="button button-default" href="mailto:skeletonffd@gmail.com" target="_blank">
                <img class="icon" src="FarEastScala_files/generic-email.svg" alt="Email">
            </a>
        </div>
    </div>

    
    <script>
        console.log('页面加载完成');
        
        const avatars = document.querySelectorAll('.avatar');
        avatars.forEach((avatar, index) => {
            avatar.onload = () => console.log(`图片 ${index + 1} 加载成功`);
            avatar.onerror = () => console.log(`图片 ${index + 1} 加载失败`);
        });
		
        document.querySelectorAll('.button').forEach(btn => {
            btn.addEventListener('mouseenter', () => {
                gsap.to(btn, { scale: 1.25, duration: 0.12, yoyo: true, repeat: 1, ease: "power1.inOut" });
            });
            btn.addEventListener('mouseleave', () => {
                gsap.to(btn, { scale: 1, duration: 0.18, ease: "power1.inOut" });
            });
        });
		
		 document.addEventListener('DOMContentLoaded', function() {
		        const bgMusic = document.getElementById('bgMusic');
		        
		        // 尝试自动播放
		        bgMusic.play().catch(function(error) {
		            console.log('自动播放被阻止，需要用户交互');
		            // 添加点击页面任意位置开始播放
		            document.body.addEventListener('click', function() {
		                bgMusic.play();
		            }, { once: true });
		        });
		        
		        // 设置音量（0.0 到 1.0）
		        bgMusic.volume = 0.5;
		    });

    </script>
</body>
</html>
